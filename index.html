<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sana Bir Şey Söylemek İstiyorum ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,.22),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(255,120,220,.18),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #ff5f9e 0%,
                    #c14cff 48%,
                    #6734c9 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;
        }


        /* =====================================================
           ARKA PLAN IŞIKLARI
        ===================================================== */

        .glow {

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.09);

            filter: blur(90px);

            pointer-events: none;

            animation:
                glowMove
                10s
                ease-in-out
                infinite
                alternate;
        }

        .glow.one {

            left: -200px;
            top: -200px;
        }

        .glow.two {

            right: -200px;
            bottom: -200px;

            animation-delay: -4s;
        }


        /* =====================================================
           YILDIZ / PARILTI
        ===================================================== */

        .sparkle {

            position: fixed;

            color: rgba(255,255,255,.75);

            pointer-events: none;

            animation:
                sparkleAnimation
                ease-in-out
                infinite;

            z-index: 1;
        }


        /* =====================================================
           UÇAN KALPLER
        ===================================================== */

        #hearts {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 2;
        }

        .floating-heart {

            position: absolute;

            bottom: -80px;

            color: rgba(255,255,255,.45);

            animation:
                floatingHeart
                linear
                infinite;
        }


        /* =====================================================
           MÜZİK BUTONU
        ===================================================== */

        #musicButton {

            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 30;

            border: 1px solid
                rgba(255,255,255,.4);

            background:
                rgba(255,255,255,.16);

            color: white;

            padding:
                12px
                18px;

            border-radius: 999px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 700;

            backdrop-filter:
                blur(10px);

            transition: .3s;
        }

        #musicButton:hover {

            transform:
                scale(1.05);

            background:
                rgba(255,255,255,.25);
        }


        /* =====================================================
           ANA KART
        ===================================================== */

        .card {

            position: relative;

            z-index: 10;

            width:
                min(
                    900px,
                    92vw
                );

            min-height: 520px;

            padding:
                60px
                40px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            background:
                rgba(255,255,255,.13);

            border:
                1px solid
                rgba(255,255,255,.30);

            border-radius:
                35px;

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                0 30px 100px
                rgba(65,0,90,.30);

            transition:
                .6s ease;
        }


        /* =====================================================
           ANA KALP
        ===================================================== */

        .main-heart {

            font-size:
                clamp(
                    50px,
                    7vw,
                    75px
                );

            margin-bottom: 20px;

            animation:
                heartbeat
                1.8s
                ease-in-out
                infinite;

            filter:
                drop-shadow(
                    0 8px 18px
                    rgba(80,0,80,.25)
                );
        }


        /* =====================================================
           ANA YAZI
        ===================================================== */

        #message {

            max-width: 820px;

            font-size:
                clamp(
                    28px,
                    5vw,
                    55px
                );

            line-height: 1.12;

            font-weight: 900;

            text-shadow:
                0 6px 25px
                rgba(70,0,90,.28);

            transition:
                .5s ease;
        }


        /* =====================================================
           ALT YAZI
        ===================================================== */

        #sub {

            min-height: 28px;

            margin-top: 20px;

            margin-bottom: 42px;

            font-size:
                clamp(
                    16px,
                    2.5vw,
                    21px
                );

            opacity: .92;

            transition:
                .5s ease;
        }


        /* =====================================================
           BUTONLAR
        ===================================================== */

        .buttons {

            width: 100%;

            min-height: 110px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 25px;

            position: relative;
        }


        button {

            border: none;

            cursor: pointer;

            color: white;

            font-weight: 900;

            font-size: 20px;

            padding:
                18px
                40px;

            border-radius: 999px;

            user-select: none;

            -webkit-tap-highlight-color:
                transparent;

            transition:
                transform .6s
                cubic-bezier(.2,.9,.2,1),

                opacity .5s ease,

                background .3s ease;
        }


        /* =====================================================
           EVET
        ===================================================== */

        #yes {

            min-width: 190px;

            background:
                linear-gradient(
                    135deg,
                    #ff2985,
                    #ff73b7
                );

            box-shadow:
                0 15px 35px
                rgba(255,30,130,.38);

            z-index: 15;
        }

        #yes:hover {

            transform:
                translateY(-4px)
                scale(1.04);
        }


        /* =====================================================
           HAYIR
        ===================================================== */

        #no {

            min-width: 190px;

            background:
                rgba(255,255,255,.17);

            border:
                1px solid
                rgba(255,255,255,.45);

            box-shadow:
                0 10px 25px
                rgba(70,0,90,.20);
        }

        #no:hover {

            background:
                rgba(255,255,255,.27);

            transform:
                translateY(-3px);
        }


        /* =====================================================
           FINAL EKRANI
        ===================================================== */

        #finalScreen {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;

            background:

                radial-gradient(
                    circle at center,
                    rgba(255,255,255,.25),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #ff4f9b,
                    #ad43ff,
                    #6831c7
                );

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .8s ease;
        }

        #finalScreen.show {

            opacity: 1;

            visibility: visible;
        }


        #finalScreen h2 {

            max-width: 1000px;

            font-size:
                clamp(
                    45px,
                    9vw,
                    110px
                );

            line-height: 1;

            font-weight: 900;

            text-shadow:
                0 10px 35px
                rgba(70,0,90,.35);

            animation:
                finalPop
                1s
                cubic-bezier(.17,.89,.32,1.3);
        }


        #finalScreen p {

            margin-top: 30px;

            font-size:
                clamp(
                    18px,
                    3vw,
                    30px
                );

            animation:
                fadeUp
                1s
                .3s
                both;
        }


        /* =====================================================
           KONFETİ
        ===================================================== */

        .confetti {

            position: fixed;

            width: 9px;

            height: 16px;

            border-radius: 3px;

            z-index: 200;

            pointer-events: none;

            animation:
                confettiExplosion
                1.7s
                ease-out
                forwards;
        }


        /* =====================================================
           KALP PATLAMASI
        ===================================================== */

        .explosion-heart {

            position: fixed;

            left: 50%;

            top: 50%;

            z-index: 201;

            pointer-events: none;

            transition:
                transform 1.6s ease-out,

                opacity 1.6s ease-out;
        }


        /* =====================================================
           ANİMASYONLAR
        ===================================================== */

        @keyframes heartbeat {

            0%,
            100% {

                transform:
                    scale(1);
            }

            50% {

                transform:
                    scale(1.13);
            }
        }


        @keyframes glowMove {

            from {

                transform:
                    translate(0,0)
                    scale(1);
            }

            to {

                transform:
                    translate(80px,60px)
                    scale(1.2);
            }
        }


        @keyframes floatingHeart {

            from {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            10% {

                opacity: .5;
            }

            100% {

                transform:
                    translateY(-120vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        @keyframes sparkleAnimation {

            0%,
            100% {

                opacity: .2;

                transform:
                    scale(.7);
            }

            50% {

                opacity: 1;

                transform:
                    scale(1.3);
            }
        }


        @keyframes finalPop {

            0% {

                transform:
                    scale(.15)
                    rotate(-7deg);

                opacity: 0;
            }

            70% {

                transform:
                    scale(1.08)
                    rotate(2deg);
            }

            100% {

                transform:
                    scale(1)
                    rotate(0);

                opacity: 1;
            }
        }


        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes confettiExplosion {

            0% {

                transform:
                    translate(0,0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {

                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    rotate(
                        var(--rotation)
                    );

                opacity: 0;
            }
        }


        /* =====================================================
           TELEFON
        ===================================================== */

        @media (max-width: 600px) {

            .card {

                width: 92vw;

                min-height: 480px;

                padding:
                    40px 20px;

                border-radius: 27px;
            }


            .main-heart {

                margin-bottom: 15px;
            }


            #message {

                font-size: 30px;
            }


            #sub {

                font-size: 16px;

                margin-top: 18px;

                margin-bottom: 30px;
            }


            .buttons {

                gap: 10px;
            }


            button {

                min-width:
                    135px !important;

                padding:
                    15px 20px;

                font-size: 17px;
            }


            #musicButton {

                top: 12px;

                right: 12px;

                padding:
                    10px 14px;

                font-size: 12px;
            }


            #finalScreen h2 {

                font-size:
                    clamp(
                        42px,
                        12vw,
                        70px
                    );
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         ARKA PLAN
    ===================================================== -->

    <div class="glow one"></div>

    <div class="glow two"></div>

    <div id="hearts"></div>


    <!-- =====================================================
         MÜZİK
    ===================================================== -->

    <!--
        Buraya kendi müzik dosyanı ekleyebilirsin.

        Örnek:

        <audio id="music" loop>
            <source src="muzik.mp3" type="audio/mpeg">
        </audio>
    -->

    <audio id="music" loop>

        <source
            src="muzik.mp3"
            type="audio/mpeg">

    </audio>


    <button id="musicButton">

        🎵 MÜZİĞİ AÇ

    </button>


    <!-- =====================================================
         ANA KART
    ===================================================== -->

    <main class="card">


        <div class="main-heart">

            ❤️

        </div>


        <h1 id="message">

            SEVGİLİM SENİ ÇOK SEVİYORUM,
            <br>

            ÇOK ÖZÜR DİLERİM
            <br>

            BENİ AFFEDER MİSİN?

        </h1>


        <p id="sub">

            Bir kerecik EVET de olur mu? 🥺

        </p>


        <div class="buttons">


            <button id="yes">

                EVET ❤️

            </button>


            <button id="no">

                HAYIR

            </button>


        </div>

    </main>


    <!-- =====================================================
         FINAL
    ===================================================== -->

    <section id="finalScreen">


        <h2>

            ÇOOOK AŞIĞIM SANAA ❤️

        </h2>


        <p>

            İyi ki varsın sevgilim. 🥹💗

        </p>


    </section>


    <script>


        /* =====================================================
           ELEMENTLER
        ===================================================== */

        const message =
            document.getElementById("message");

        const sub =
            document.getElementById("sub");

        const yes =
            document.getElementById("yes");

        const no =
            document.getElementById("no");

        const finalScreen =
            document.getElementById("finalScreen");

        const hearts =
            document.getElementById("hearts");

        const music =
            document.getElementById("music");

        const musicButton =
            document.getElementById("musicButton");


        /* =====================================================
           HAYIR SAYACI
        ===================================================== */

        let noCount = 0;


        /* =====================================================
           HAYIR MESAJLARI
        ===================================================== */

        const messages = [

            "LÜTFEN 🥺",

            "AMA ÇOK PİŞMANIM 😭",

            "VALLA DÜZELİCEM KİNE ❤️",

            "ÇOK SEVİYORUM SENİ 🥹"

        ];


        const subtitles = [

            "Ne olur bir şans daha ver... 🥺",

            "Gerçekten çok pişmanım... 😭",

            "Bak söz veriyorum, düzelicem ❤️",

            "Sadece seni kaybetmek istemiyorum... 🥹"

        ];


        /* =====================================================
           HAYIR BUTONU
        ===================================================== */

        no.addEventListener(
            "click",
            function () {


                noCount++;


                if (noCount > 4) {

                    return;

                }


                /* MESAJ */

                message.innerHTML =
                    messages[
                        noCount - 1
                    ];


                sub.innerHTML =
                    subtitles[
                        noCount - 1
                    ];


                /* EVET BÜYÜME */

                const yesScales = [

                    1.15,

                    1.35,

                    1.65,

                    2.15

                ];


                yes.style.transform =
                    `scale(${yesScales[noCount - 1]})`;


                /* HAYIR KÜÇÜLME */

                const noScales = [

                    .82,

                    .62,

                    .42,

                    .18

                ];


                no.style.transform =
                    `scale(${noScales[noCount - 1]})`;


                /* =================================================
                   4. HAYIR
                ================================================= */

                if (noCount === 4) {


                    /*
                     * Şimdilik iki butonu gizle.
                     */

                    yes.style.opacity =
                        "0";

                    yes.style.pointerEvents =
                        "none";


                    no.style.opacity =
                        "0";

                    no.style.pointerEvents =
                        "none";


                    /*
                     * 1.8 saniye boyunca
                     *
                     * ÇOK SEVİYORUM SENİ 🥹
                     *
                     * görünsün.
                     */

                    setTimeout(
                        function () {


                            /*
                             * EVET BUTONU
                             */

                            yes.style.position =
                                "fixed";


                            yes.style.left =
                                "50%";


                            yes.style.top =
                                "50%";


                            yes.style.width =
                                "100vw";


                            yes.style.height =
                                "100vh";


                            yes.style.minWidth =
                                "0";


                            yes.style.padding =
                                "0";


                            yes.style.borderRadius =
                                "0";


                            yes.style.transform =
                                "translate(-50%, -50%)";


                            yes.style.fontSize =
                                "clamp(30px,7vw,70px)";


                            yes.innerHTML =
                                "EVET DE GÜZELİMM 🌹";


                            yes.style.zIndex =
                                "50";


                            yes.style.opacity =
                                "1";


                            yes.style.pointerEvents =
                                "auto";


                        },
                        1800
                    );

                }

            }
        );


        /* =====================================================
           EVET
        ===================================================== */

        yes.addEventListener(
            "click",
            function () {

                showFinal();

            }
        );


        /* =====================================================
           FİNAL
        ===================================================== */

        function showFinal() {


            finalScreen.classList.add(
                "show"
            );


            createConfetti();

            createHeartExplosion();


        }


        /* =====================================================
           KONFETİ
        ===================================================== */

        function createConfetti() {


            const amount = 130;


            for (
                let i = 0;
                i < amount;
                i++
            ) {


                const piece =
                    document.createElement(
                        "div"
                    );


                piece.className =
                    "confetti";


                piece.style.left =
                    "50%";


                piece.style.top =
                    "50%";


                const x =
                    (
                        Math.random() - .5
                    )
                    *
                    window.innerWidth
                    *
                    1.5;


                const y =
                    (
                        Math.random() - .5
                    )
                    *
                    window.innerHeight
                    *
                    1.5;


                const rotation =
                    Math.random()
                    * 1200
                    - 600;


                piece.style.setProperty(
                    "--x",
                    `${x}px`
                );


                piece.style.setProperty(
                    "--y",
                    `${y}px`
                );


                piece.style.setProperty(
                    "--rotation",
                    `${rotation}deg`
                );


                const colors = [

                    "#ffffff",

                    "#ffd1ea",

                    "#ff9acb",

                    "#e6b2ff",

                    "#d078ff",

                    "#ff72ad"

                ];


                piece.style.background =
                    colors[
                        Math.floor(
                            Math.random()
                            *
                            colors.length
                        )
                    ];


                piece.style.animationDelay =
                    `${Math.random() * .25}s`;


                document.body.appendChild(
                    piece
                );


                setTimeout(
                    function () {

                        piece.remove();

                    },
                    2200
                );

            }

        }


        /* =====================================================
           KALP PATLAMASI
        ===================================================== */

        function createHeartExplosion() {


            for (
                let i = 0;
                i < 30;
                i++
            ) {


                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "explosion-heart";


                heart.innerHTML =
                    Math.random() > .25
                    ? "❤️"
                    : "💗";


                const x =
                    (
                        Math.random() - .5
                    )
                    * 750;


                const y =
                    (
                        Math.random() - .5
                    )
                    * 750;


                heart.style.fontSize =
                    `${
                        18
                        +
                        Math.random() * 28
                    }px`;


                document.body.appendChild(
                    heart
                );


                requestAnimationFrame(
                    function () {


                        heart.style.transform =
                            `
                            translate(
                                ${x}px,
                                ${y}px
                            )

                            rotate(
                                ${Math.random() * 360}deg
                            )
                            `;


                        heart.style.opacity =
                            "0";


                    }
                );


                setTimeout(
                    function () {

                        heart.remove();

                    },
                    1900
                );

            }

        }


        /* =====================================================
           UÇAN KALPLER
        ===================================================== */

        for (
            let i = 0;
            i < 30;
            i++
        ) {


            const heart =
                document.createElement(
                    "span"
                );


            heart.className =
                "floating-heart";


            heart.innerHTML =
                Math.random() > .3
                ? "♥"
                : "♡";


            heart.style.left =
                `${Math.random() * 100}%`;


            heart.style.fontSize =
                `
                ${
                    18
                    +
                    Math.random() * 28
                }px
                `;


            heart.style.animationDuration =
                `
                ${
                    6
                    +
                    Math.random() * 9
                }s
                `;


            heart.style.animationDelay =
                `
                ${
                    Math.random() * 10
                }s
                `;


            hearts.appendChild(
                heart
            );

        }


        /* =====================================================
           PARILTILAR
        ===================================================== */

        for (
            let i = 0;
            i < 35;
            i++
        ) {


            const sparkle =
                document.createElement(
                    "div"
                );


            sparkle.className =
                "sparkle";


            sparkle.innerHTML =
                Math.random() > .5
                ? "✦"
                : "✧";


            sparkle.style.left =
                `${Math.random() * 100}%`;


            sparkle.style.top =
                `${Math.random() * 100}%`;


            sparkle.style.fontSize =
                `
                ${
                    8
                    +
                    Math.random() * 18
                }px
                `;


            sparkle.style.animationDuration =
                `
                ${
                    2
                    +
                    Math.random() * 4
                }s
                `;


            sparkle.style.animationDelay =
                `
                ${
                    Math.random() * 4
                }s
                `;


            document.body.appendChild(
                sparkle
            );

        }


        /* =====================================================
           MÜZİK
        ===================================================== */

        let musicPlaying = false;


        musicButton.addEventListener(
            "click",
            function () {


                /*
                 * Eğer müzik dosyası eklenmemişse
                 */

                if (
                    music.children.length === 0
                ) {

                    alert(
                        "Önce index.html ile aynı klasöre muzik.mp3 dosyasını koymalısın ❤️"
                    );

                    return;

                }


                if (!musicPlaying) {


                    music.play();


                    musicPlaying = true;


                    musicButton.innerHTML =
                        "🔊 MÜZİK AÇIK";


                } else {


                    music.pause();


                    musicPlaying = false;


                    musicButton.innerHTML =
                        "🎵 MÜZİĞİ AÇ";

                }

            }
        );


    </script>

</body>
</html>
