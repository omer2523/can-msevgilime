<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevgilime ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255,255,255,.25),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 80% 10%,
                    rgba(255,150,220,.2),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #ff5fa2,
                    #c34dff,
                    #7135ca
                );

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }


        /* ARKA PLAN PARILTILARI */

        .glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;

            background: rgba(255,255,255,.1);
            filter: blur(80px);

            pointer-events: none;

            animation: glowMove 8s ease-in-out infinite alternate;
        }

        .glow.one {
            top: -180px;
            left: -150px;
        }

        .glow.two {
            right: -150px;
            bottom: -180px;
            animation-delay: -3s;
        }


        /* UÇUŞAN KALPLER */

        .hearts {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            bottom: -60px;

            color: rgba(255,255,255,.5);

            animation-name: floatingHeart;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }


        /* ANA KART */

        .card {
            position: relative;
            z-index: 5;

            width: min(900px, 92vw);
            min-height: 500px;

            padding: 60px 40px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            background: rgba(255,255,255,.13);

            border: 1px solid rgba(255,255,255,.3);

            border-radius: 32px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(70,0,90,.3);
        }


        /* KALP */

        .main-heart {
            font-size: 65px;
            margin-bottom: 20px;

            animation: heartBeat 1.8s infinite ease-in-out;

            filter:
                drop-shadow(
                    0 5px 15px rgba(100,0,80,.3)
                );
        }


        /* ANA YAZI */

        #message {
            max-width: 800px;

            font-size: clamp(28px,5vw,54px);

            line-height: 1.15;

            font-weight: 800;

            text-shadow:
                0 5px 20px rgba(80,0,90,.25);

            transition: .4s ease;
        }


        /* ALT YAZI */

        #sub {
            margin-top: 20px;
            margin-bottom: 40px;

            font-size: clamp(16px,2.5vw,21px);

            opacity: .9;

            min-height: 25px;

            transition: .4s ease;
        }


        /* BUTONLAR */

        .buttons {
            width: 100%;
            min-height: 110px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 25px;

            position: relative;
        }


        button {
            border: none;

            cursor: pointer;

            color: white;

            font-size: 20px;
            font-weight: 800;

            padding: 18px 40px;

            border-radius: 999px;

            transition:
                transform .55s cubic-bezier(.2,.9,.2,1),
                width .55s ease,
                height .55s ease,
                opacity .4s ease;

            user-select: none;

            -webkit-tap-highlight-color: transparent;
        }


        /* EVET */

        #yes {
            min-width: 180px;

            background:
                linear-gradient(
                    135deg,
                    #ff3188,
                    #ff70b7
                );

            box-shadow:
                0 12px 30px rgba(255,30,130,.35);

            z-index: 10;
        }


        /* HAYIR */

        #no {
            min-width: 180px;

            background: rgba(255,255,255,.18);

            border: 1px solid rgba(255,255,255,.45);

            box-shadow:
                0 8px 25px rgba(70,0,90,.18);
        }


        /* FINAL */

        .final-screen {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,.2),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #ff4f9a,
                    #ad43ff,
                    #6932c7
                );

            opacity: 0;
            visibility: hidden;

            transition: opacity .7s ease;
        }

        .final-screen.show {
            opacity: 1;
            visibility: visible;
        }


        .final-screen h2 {
            font-size: clamp(45px,9vw,105px);

            line-height: 1;

            font-weight: 900;

            text-shadow:
                0 8px 30px rgba(80,0,90,.3);

            animation:
                finalPop .9s
                cubic-bezier(.17,.89,.32,1.3);
        }


        .final-screen p {
            margin-top: 30px;

            font-size: clamp(18px,3vw,30px);

            animation:
                fadeUp 1s .3s both;
        }


        /* KONFETİ */

        .confetti {
            position: fixed;

            width: 9px;
            height: 15px;

            border-radius: 2px;

            z-index: 200;

            pointer-events: none;

            animation:
                confettiExplosion 1.5s
                ease-out forwards;
        }


        /* PATLAYAN KALPLER */

        .explosion-heart {
            position: fixed;

            left: 50%;
            top: 50%;

            z-index: 201;

            pointer-events: none;

            transition:
                transform 1.5s ease-out,
                opacity 1.5s ease-out;
        }


        /* ANİMASYONLAR */

        @keyframes heartBeat {
            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }


        @keyframes glowMove {
            from {
                transform:
                    translate(0,0)
                    scale(1);
            }

            to {
                transform:
                    translate(70px,50px)
                    scale(1.18);
            }
        }


        @keyframes floatingHeart {
            from {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            to {
                transform:
                    translateY(-120vh)
                    rotate(360deg);
            }
        }


        @keyframes finalPop {
            0% {
                transform:
                    scale(.2)
                    rotate(-7deg);

                opacity: 0;
            }

            70% {
                transform:
                    scale(1.08)
                    rotate(2deg);
            }

            100% {
                transform:
                    scale(1)
                    rotate(0);

                opacity: 1;
            }
        }


        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes confettiExplosion {
            0% {
                transform:
                    translate(0,0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translate(var(--x),var(--y))
                    rotate(var(--rotation));

                opacity: 0;
            }
        }


        /* TELEFON */

        @media (max-width:600px) {

            .card {
                width: 92vw;
                min-height: 480px;

                padding: 40px 20px;

                border-radius: 25px;
            }

            .main-heart {
                font-size: 52px;
            }

            #message {
                font-size: 30px;
            }

            #sub {
                font-size: 16px;
                margin-bottom: 28px;
            }

            .buttons {
                gap: 12px;
            }

            button {
                min-width: 135px !important;

                padding: 15px 20px;

                font-size: 17px;
            }
        }

    </style>
</head>


<body>


    <!-- ARKA PLAN -->

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div
        class="hearts"
        id="hearts">
    </div>


    <!-- ANA SAYFA -->

    <main
        class="card"
        id="card">


        <div class="main-heart">
            ❤️
        </div>


        <h1 id="message">

            SEVGİLİM SENİ ÇOK SEVİYORUM,
            <br>

            ÇOK ÖZÜR DİLERİM
            <br>

            BENİ AFFEDER MİSİN?

        </h1>


        <p id="sub">

            Bir kerecik EVET de olur mu balım? 🥺

        </p>


        <div
            class="buttons"
            id="buttons">


            <button id="yes">
                EVET ❤️
            </button>


            <button id="no">
                HAYIR
            </button>


        </div>

    </main>


    <!-- FINAL EKRANI -->

    <section
        class="final-screen"
        id="finalScreen">


        <h2>
            🌹ÇOOOK AŞIĞIM SANAA RUH EŞİM🥹❤️
        </h2>


        <p>
            İyi ki varsın Fatmagül'üm🌹. 🥹💗
        </p>


    </section>


    <script>


        /* ELEMENTLER */

        const message =
            document.getElementById("message");

        const sub =
            document.getElementById("sub");

        const yes =
            document.getElementById("yes");

        const no =
            document.getElementById("no");

        const finalScreen =
            document.getElementById("finalScreen");

        const hearts =
            document.getElementById("hearts");


        /* HAYIR SAYISI */

        let noCount = 0;


        /* HAYIR MESAJLARI */

        const messages = [

            "LÜTFEN 🥺",

            "AMA ÇOK PİŞMANIM 😭",

            "VALLA DÜZELİCEMKİNE ❤️",

            "ÇOK SEVİYORUM SENİ 🥹"

        ];


        /* ALT MESAJLAR */

        const subtitles = [

            "Ne olur bir şans daha ver biriciğim... 🥺",

            "Gerçekten çooook pişmanım güzelim... 😭",

            "Söz veriyorum her şeyim... ❤️",

            "Vallakine... seni çok seviyorum 🥹"

        ];


        /* ==================================================
           HAYIR BUTONU
        ================================================== */

        no.addEventListener("click", function () {

            noCount++;


            if (noCount > 4) {
                return;
            }


            /* MESAJ DEĞİŞTİR */

            message.innerHTML =
                messages[noCount - 1];

            sub.innerHTML =
                subtitles[noCount - 1];


            /* EVET BÜYÜSÜN */

            const yesScales = [
                1.15,
                1.35,
                1.65,
                2.15
            ];

            yes.style.transform =
                `scale(${yesScales[noCount - 1]})`;


            /* HAYIR KÜÇÜLSÜN */

            const noScales = [
                .82,
                .62,
                .42,
                .18
            ];

            no.style.transform =
                `scale(${noScales[noCount - 1]})`;


            /* 4. HAYIR */

            if (noCount === 4) {

               if (noCount === 4) {

    /* 4. MESAJ ÖNCE GÖRÜNSÜN */

    yes.style.opacity = "0";
    yes.style.pointerEvents = "none";

    no.style.opacity = "0";
    no.style.pointerEvents = "none";


    /* 1.5 SANİYE BEKLE */

    setTimeout(function () {

        /* EVET BUTONUNU EKRANA GETİR */

        yes.style.position = "fixed";

        yes.style.left = "50%";

        yes.style.top = "50%";

        yes.style.width = "100vw";

        yes.style.height = "100vh";

        yes.style.minWidth = "0";

        yes.style.padding = "0";

        yes.style.borderRadius = "0";

        yes.style.transform =
            "translate(-50%, -50%)";

        yes.style.fontSize =
            "clamp(30px, 7vw, 70px)";

        yes.innerHTML =
            "EVET DE GÜZELİMM ❤️";

        yes.style.zIndex = "50";

        /* BUTONU GÖSTER */

        yes.style.opacity = "1";

        yes.style.pointerEvents = "auto";

    }, 1500);

}

            }

        });


        /* ==================================================
           EVET BUTONU
        ================================================== */

        yes.addEventListener("click", function () {

            showFinal();

        });


        /* ==================================================
           FİNAL
        ================================================== */

        function showFinal() {

            finalScreen.classList.add("show");

            createConfetti();

            createHeartExplosion();

        }


        /* ==================================================
           KONFETİ
        ================================================== */

        function createConfetti() {

            const amount = 100;


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const piece =
                    document.createElement("div");


                piece.className =
                    "confetti";


                piece.style.left =
                    "50%";

                piece.style.top =
                    "50%";


                const x =
                    (Math.random() - .5)
                    * window.innerWidth
                    * 1.4;


                const y =
                    (Math.random() - .5)
                    * window.innerHeight
                    * 1.4;


                const rotation =
                    Math.random() * 1000 - 500;


                piece.style.setProperty(
                    "--x",
                    `${x}px`
                );


                piece.style.setProperty(
                    "--y",
                    `${y}px`
                );


                piece.style.setProperty(
                    "--rotation",
                    `${rotation}deg`
                );


                const colors = [

                    "#ffffff",
                    "#ffd1ea",
                    "#ff9acb",
                    "#e7b5ff",
                    "#d078ff",
                    "#ff72ad"

                ];


                piece.style.background =
                    colors[
                        Math.floor(
                            Math.random()
                            * colors.length
                        )
                    ];


                piece.style.animationDelay =
                    `${Math.random() * .25}s`;


                document.body.appendChild(
                    piece
                );


                setTimeout(function () {

                    piece.remove();

                }, 2000);

            }

        }


        /* ==================================================
           KALP PATLAMASI
        ================================================== */

        function createHeartExplosion() {

            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const heart =
                    document.createElement("div");


                heart.className =
                    "explosion-heart";


                heart.innerHTML =
                    Math.random() > .25
                    ? "❤️"
                    : "💗";


                const x =
                    (Math.random() - .5)
                    * 700;


                const y =
                    (Math.random() - .5)
                    * 700;


                heart.style.fontSize =
                    `${18 + Math.random() * 25}px`;


                document.body.appendChild(
                    heart
                );


                requestAnimationFrame(function () {

                    heart.style.transform =
                        `
                        translate(
                            ${x}px,
                            ${y}px
                        )
                        rotate(
                            ${Math.random() * 360}deg
                        )
                        `;

                    heart.style.opacity =
                        "0";

                });


                setTimeout(function () {

                    heart.remove();

                }, 1800);

            }

        }


        /* ==================================================
           UÇUŞAN KALPLER
        ================================================== */

        for (
            let i = 0;
            i < 25;
            i++
        ) {

            const heart =
                document.createElement("span");


            heart.className =
                "floating-heart";


            heart.innerHTML =
                Math.random() > .3
                ? "♥"
                : "♡";


            heart.style.left =
                `${Math.random() * 100}%`;


            heart.style.fontSize =
                `${18 + Math.random() * 25}px`;


            heart.style.animationDuration =
                `${6 + Math.random() * 9}s`;


            heart.style.animationDelay =
                `${Math.random() * 8}s`;


            heart.style.opacity =
                `${.2 + Math.random() * .45}`;


            hearts.appendChild(
                heart
            );

        }

    </script>

</body>
</html>
